  <style>/* ==========================================================================
   Nautical chart paper system — shipping-viz
   ========================================================================== */
:root {
  --paper: #F7F2E7;
  --paper-deep: #EFE7D3;
  --card: #FDFAF2;
  --navy: #14263B;
  --ink-soft: #3D4E63;
  --taupe: #8C8577;
  --rule: #D8CFBA;
  --c-container: #0E67B5;
  --c-dry: #C25E28;
  --c-tanker: #1F8A70;
  --c-red: #C0392B;
  --seg-idle: #E4DBC4;
  --font-head: "Songti SC", "Noto Serif SC", "STSong", serif;
  --font-body: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  --font-num: "SF Mono", "Menlo", monospace;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html { scroll-behavior: smooth; }

body {
  background: var(--paper);
  color: var(--navy);
  font-family: var(--font-body);
  font-size: 17px;
  line-height: 1.9;
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}
.gap-wrap { overflow-x: auto; }

.num, .mono { font-family: var(--font-num); }

h1, h2, h3 { font-family: var(--font-head); font-weight: 700; }

h2 {
  font-size: 40px;
  line-height: 1.35;
  letter-spacing: .01em;
  margin-bottom: 18px;
}
h2::after {
  content: "";
  display: block;
  width: 64px;
  height: 4px;
  background: var(--navy);
  margin-top: 14px;
}
h3 { font-size: 22px; line-height: 1.4; }

a { color: var(--c-container); }

.kicker {
  font-family: var(--font-num);
  font-size: 12px;
  letter-spacing: .18em;
  text-transform: uppercase;
  color: var(--taupe);
  margin-bottom: 14px;
}

.section { padding: 110px 24px; }
.section.deep { background: var(--paper-deep); }
.prose { max-width: 720px; margin: 0 auto; }
.viz { max-width: 1080px; margin: 48px auto 0; }
.prose p { margin-bottom: 1.1em; color: var(--ink-soft); }
.prose p.lede { font-size: 19px; color: var(--navy); }
.prose strong { color: var(--navy); }

/* Hard-edged editorial cards */
.card {
  background: var(--card);
  border: 2px solid var(--navy);
  box-shadow: 6px 6px 0 rgba(20, 38, 59, .16);
}

/* Source lines */
.srcline {
  max-width: 1080px;
  margin: 18px auto 0;
  font-size: 13px;
  line-height: 1.7;
  color: var(--taupe);
}
.srcline .asof { font-family: var(--font-num); }
.srcline details { display: inline-block; }
.srcline summary {
  cursor: pointer;
  color: var(--ink-soft);
  text-decoration: underline dotted;
  list-style: none;
  display: inline;
}
.srcline summary::-webkit-details-marker { display: none; }
.srcline details ul { margin: 8px 0 4px 18px; }
.srcline details li { margin-bottom: 3px; }
.srcline a { color: var(--ink-soft); word-break: break-all; }

/* Tooltip */
#tooltip {
  position: fixed;
  z-index: 900;
  background: var(--navy);
  color: var(--paper);
  font-size: 13px;
  line-height: 1.65;
  max-width: 300px;
  padding: 10px 12px;
  box-shadow: 6px 6px 0 rgba(20, 38, 59, .25);
  pointer-events: none;
  opacity: 0;
  transition: opacity .15s;
}
#tooltip .tt-title { font-weight: 700; margin-bottom: 4px; }
#tooltip .tt-src { color: #B9C4CF; font-size: 11.5px; margin-top: 6px; }

/* Drilldown overlay */
#overlay {
  position: fixed;
  inset: 0;
  z-index: 1000;
  background: rgba(20, 38, 59, .45);
  display: none;
  align-items: center;
  justify-content: center;
  padding: 24px;
}
#overlay.open { display: flex; }
#overlay .sheet {
  background: var(--card);
  border: 2px solid var(--navy);
  box-shadow: 10px 10px 0 rgba(20, 38, 59, .3);
  max-width: 520px;
  width: 100%;
  max-height: 82vh;
  overflow-y: auto;
  padding: 26px 28px 30px;
  position: relative;
}
#overlay .close {
  position: absolute;
  top: 10px;
  right: 12px;
  border: 2px solid var(--navy);
  background: var(--card);
  color: var(--navy);
  font-family: var(--font-num);
  font-size: 14px;
  width: 32px;
  height: 32px;
  cursor: pointer;
  box-shadow: 3px 3px 0 rgba(20, 38, 59, .25);
}
#overlay .close:hover { background: var(--paper-deep); }
#overlay h3 { font-size: 20px; margin-bottom: 10px; padding-right: 36px; }
#overlay .tag {
  display: inline-block;
  font-family: var(--font-num);
  font-size: 11.5px;
  letter-spacing: .08em;
  color: var(--paper);
  padding: 2px 10px;
  margin-bottom: 14px;
}
#overlay .dd-nums { display: flex; flex-wrap: wrap; gap: 10px 26px; margin: 6px 0 14px; }
#overlay .dd-nums .nv .v { font-family: var(--font-num); font-size: 24px; font-weight: 700; }
#overlay .dd-nums .nv .l { font-size: 12px; color: var(--taupe); }
#overlay p { font-size: 14.5px; line-height: 1.8; color: var(--ink-soft); margin-bottom: 10px; }
#overlay .dd-src { font-size: 12.5px; color: var(--taupe); border-top: 1px solid var(--rule); padding-top: 10px; margin-top: 12px; }
#overlay .dd-src a { color: var(--ink-soft); word-break: break-all; }

/* ============================ Cover ============================ */
#cover {
  min-height: 100vh;
  position: relative;
  overflow: hidden;
  background: linear-gradient(180deg, #F9F5EC 0%, var(--paper) 55%, #E9E0C9 100%);
  display: flex;
  align-items: center;
  justify-content: center;
}
#cover .inner {
  max-width: 880px;
  padding: 0 24px 26vh;
  position: relative;
  z-index: 3;
  text-align: left;
}
#cover h1 {
  font-size: clamp(48px, 7.6vw, 92px);
  line-height: 1.18;
  letter-spacing: .06em;
}
#cover h1 .one { color: var(--c-red); }
#cover .sub {
  margin-top: 22px;
  font-size: 18px;
  color: var(--ink-soft);
  max-width: 640px;
}
#cover .asof-line {
  margin-top: 14px;
  font-family: var(--font-num);
  font-size: 12.5px;
  color: var(--taupe);
  letter-spacing: .06em;
}
#cover .stats { display: flex; gap: 42px; margin-top: 44px; flex-wrap: wrap; }
#cover .stat { cursor: pointer; }
#cover .stat .v { font-family: var(--font-num); font-size: 40px; font-weight: 700; line-height: 1.1; }
#cover .stat .bar { height: 5px; margin-top: 8px; }
#cover .stat .l { font-size: 13px; color: var(--ink-soft); margin-top: 8px; max-width: 200px; line-height: 1.5; }

#sea { position: absolute; left: 0; right: 0; bottom: 0; height: 24vh; z-index: 1; pointer-events: none; overflow: hidden; }
.px-ship { image-rendering: pixelated; }
/* two pixelated wave bands: rows of small square dashes, two tones,
   drifting horizontally at different speeds */
.wave-band {
  position: absolute;
  left: 0;
  right: 0;
  height: 18px;
  background-repeat: repeat-x;
  image-rendering: pixelated;
}
/* band 1 (#D8CFBA): crest dashes over the first half of each 96px period,
   baseline dashes across the whole period */
.wave-band.b1 {
  bottom: 96px;
  background-image:
    linear-gradient(90deg,
      #D8CFBA 0 6px, transparent 6px 12px,
      #D8CFBA 12px 18px, transparent 18px 24px,
      #D8CFBA 24px 30px, transparent 30px 36px,
      #D8CFBA 36px 42px, transparent 42px 96px),
    linear-gradient(90deg, #D8CFBA 0 6px, transparent 6px 24px);
  background-size: 96px 6px, 24px 6px;
  background-position: 0 0, 0 12px;
  animation: drift1 7s linear infinite;
}
/* band 2 (#C9BFA6): crest dashes over the second half, drifting reverse */
.wave-band.b2 {
  bottom: 72px;
  background-image:
    linear-gradient(90deg,
      transparent 0 48px,
      #C9BFA6 48px 54px, transparent 54px 60px,
      #C9BFA6 60px 66px, transparent 66px 72px,
      #C9BFA6 72px 78px, transparent 78px 84px,
      #C9BFA6 84px 90px, transparent 90px 96px),
    linear-gradient(90deg, #C9BFA6 0 6px, transparent 6px 24px);
  background-size: 96px 6px, 24px 6px;
  background-position: 0 0, 12px 12px;
  animation: drift2 11s linear infinite reverse;
}
@keyframes drift1 {
  to { background-position: -96px 0, -96px 12px; }
}
@keyframes drift2 {
  to { background-position: -96px 0, -84px 12px; }
}
.sail { position: absolute; bottom: 6vh; will-change: transform; animation: sail linear infinite; }
.bob { animation: bobship 3.2s ease-in-out infinite; }
@keyframes bobship {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-5px); }
}
@keyframes sail {
  from { transform: translateX(-16vw); }
  to { transform: translateX(116vw); }
}
#scroll-hint {
  position: absolute;
  bottom: 26vh;
  left: 50%;
  transform: translateX(-50%);
  z-index: 4;
  color: var(--navy);
  font-family: var(--font-num);
  font-size: 12px;
  letter-spacing: .2em;
  text-align: center;
  animation: bob 2s ease-in-out infinite;
}
#scroll-hint .arrow { display: block; font-size: 18px; margin-top: 4px; }
@keyframes bob {
  0%, 100% { transform: translate(-50%, 0); }
  50% { transform: translate(-50%, 8px); }
}

/* ============================ Clocks ============================ */
.clocks { display: flex; gap: 34px; justify-content: center; flex-wrap: wrap; }
.clock-card { width: 318px; text-align: center; }
.clock-card svg { display: block; margin: 0 auto; overflow: visible; }
.clock-meta { margin-top: 14px; }
.clock-meta .sector-name { font-family: var(--font-head); font-size: 20px; font-weight: 700; }
.clock-meta .stage-line {
  margin: 6px 0 10px;
  font-family: var(--font-head);
  font-size: 16.5px;
  line-height: 1.4;
}
.clock-meta .idx { font-family: var(--font-num); font-size: 30px; font-weight: 700; }
.clock-meta .why { font-size: 13.5px; color: var(--ink-soft); line-height: 1.7; margin-top: 8px; }
.clock-meta .src { font-size: 12px; color: var(--taupe); margin-top: 8px; }
.dial-stage { cursor: pointer; }

/* ============================ Scrolly shared ============================ */
.scrolly {
  max-width: 1240px;
  margin: 0 auto;
  display: flex;
  align-items: flex-start;
  position: relative;
}
.scrolly .sticky-fig {
  position: sticky;
  top: 0;
  height: 100vh;
  flex: 1 1 auto;
  display: flex;
  align-items: center;
  justify-content: flex-start;
}
.scrolly .steps { flex: 0 0 auto; margin-left: auto; }
#scrolly-stock .steps { max-width: 360px; }
#scrolly-curves .steps, #scrolly-tiles .steps { max-width: 340px; }
.step {
  margin-bottom: 78vh;
  opacity: .32;
  transform: translateY(6px);
  transition: opacity .35s, transform .35s;
}
.step:first-child { margin-top: 12vh; }
.step:last-child { margin-bottom: 55vh; }
.step .step-card {
  background: rgba(253, 250, 242, .96);
  border: 1.5px solid var(--navy);
  box-shadow: 6px 6px 0 rgba(20, 38, 59, .16);
  padding: 20px 22px;
}
.step.active { opacity: 1; transform: translateY(0); }
.step .n { font-family: var(--font-num); font-size: 11.5px; color: var(--taupe); letter-spacing: .14em; }
.step h3 { font-size: 19px; margin: 6px 0 8px; }
.step p { font-size: 14px; line-height: 1.8; color: var(--ink-soft); }

/* ============================ Tiles ============================ */
.tilewall { max-width: 1080px; margin: 0 auto; }
.tile-group-label {
  font-family: var(--font-num);
  font-size: 12px;
  letter-spacing: .14em;
  text-transform: uppercase;
  margin: 22px 0 10px;
}
.tile-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
.tile {
  min-height: 62px;
  background: var(--card);
  border: 1.5px solid var(--navy);
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 6px 8px;
  cursor: pointer;
  position: relative;
  transition: transform .7s, opacity .7s, background-color .7s, border-color .7s;
}
.tile svg { flex: 0 0 auto; image-rendering: pixelated; }
.tile .tname { font-size: 11.5px; line-height: 1.35; font-weight: 600; color: var(--navy); }
.tile .bcap {
  display: block;
  font-size: 9.5px;
  font-weight: 400;
  color: var(--c-red);
  margin-top: 2px;
  opacity: 0;
  transition: opacity .5s;
}
/* fate expressed through the tile face — no badges */
.tile.tint-bankrupt { background: #F1DCD3; transform: rotate(-3deg); z-index: 3; }
.tile.tint-merged { background: #E3E0D8; }
.tile.tint-renamed { background: #DFE9F3; }
.tile.tint-restructured { background: #E4EEE9; }
.tile.tint-rescued { background: #E9E4DA; }
.tile.faded { opacity: .22; }

/* ============================ Quarterly ============================ */
.seg-btns { display: inline-flex; margin: 6px 0 8px; }
.seg-btns button {
  font-family: var(--font-body);
  font-size: 14px;
  padding: 9px 18px;
  background: var(--card);
  color: var(--navy);
  border: 2px solid var(--navy);
  margin-left: -2px;
  cursor: pointer;
}
.seg-btns button:first-child { margin-left: 0; }
.seg-btns button:hover { background: var(--paper-deep); }
.seg-btns button.on { background: var(--navy); color: var(--paper); }
.play-btn {
  font-family: var(--font-num);
  font-size: 13px;
  padding: 9px 20px;
  background: var(--card);
  color: var(--navy);
  border: 2px solid var(--navy);
  box-shadow: 4px 4px 0 rgba(20, 38, 59, .25);
  cursor: pointer;
}
.play-btn:hover { background: var(--navy); color: var(--paper); }
.play-btn:disabled { opacity: .5; cursor: default; }
.view-note { font-size: 13.5px; color: var(--ink-soft); max-width: 720px; margin: 10px 0 0; }

/* ============================ Scorecard ============================ */
.score-row {
  display: grid;
  grid-template-columns: 150px 1fr 150px;
  border: 1.5px solid var(--navy);
  box-shadow: 5px 5px 0 rgba(20, 38, 59, .16);
  background: var(--card);
  margin-bottom: 14px;
  cursor: pointer;
}
.score-row > div { padding: 16px 18px; }
.score-row .sc-window { border-right: 1.5px solid var(--rule); }
.score-row .sc-window .w { font-family: var(--font-num); font-weight: 700; font-size: 15px; }
.score-row .sc-window .d { font-size: 12px; color: var(--taupe); margin-top: 6px; line-height: 1.5; }
.score-row .sc-mid { font-size: 13.5px; line-height: 1.75; color: var(--ink-soft); }
.score-row .sc-mid .m { color: var(--navy); font-weight: 600; }
.score-row .sc-role {
  color: var(--paper);
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  font-family: var(--font-num);
  font-size: 12px;
  letter-spacing: .06em;
  line-height: 1.5;
}
.rejected { margin-top: 34px; }
.rejected .card { padding: 18px 22px; margin-bottom: 12px; }
.rejected h4 { font-family: var(--font-head); font-size: 16.5px; margin-bottom: 6px; }
.rejected p { font-size: 13.5px; color: var(--ink-soft); line-height: 1.75; }
.rule-note {
  margin-top: 16px;
  font-size: 14px;
  color: var(--c-red);
  border-left: 4px solid var(--c-red);
  padding-left: 14px;
}

/* ============================ Stage lanes ============================ */
.lanes { display: flex; gap: 30px; flex-wrap: wrap; justify-content: center; }
.lane-card { flex: 1 1 300px; max-width: 340px; }
.lane-wrap { position: relative; padding-top: 64px; }
.lane-here {
  position: absolute;
  top: 0;
  transform: translateX(-50%);
  text-align: center;
  font-family: var(--font-num);
  font-size: 11.5px;
  color: var(--navy);
  white-space: nowrap;
}
.lane-here svg { display: block; margin: 0 auto 2px; image-rendering: pixelated; }
.lane { display: flex; height: 128px; border: 2px solid var(--navy); }
.lane .seg {
  flex: 1;
  background: var(--card);
  border-right: 2px solid var(--navy);
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 8px;
  font-size: 12px;
  line-height: 1.45;
  position: relative;
}
.lane .seg:last-child { border-right: 0; }
.lane .seg.cur { color: #fff; border: 2px solid var(--navy); font-weight: 700; }
.lane-periods { display: flex; margin-top: 6px; }
.lane-periods span {
  flex: 1;
  text-align: center;
  font-family: var(--font-num);
  font-size: 10px;
  color: var(--taupe);
  line-height: 1.4;
  padding: 0 3px;
}
.metric-cards { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 18px; }
.metric-card {
  background: #fff;
  border: 1.5px solid var(--navy);
  box-shadow: 5px 5px 0 rgba(20, 38, 59, .14);
  padding: 12px 14px;
}
.metric-card .v { font-family: var(--font-num); font-size: 21px; font-weight: 700; line-height: 1.2; }
.metric-card .l { font-size: 11.5px; color: var(--ink-soft); margin-top: 4px; line-height: 1.5; }
.metric-card .s { font-size: 10.5px; color: var(--taupe); margin-top: 4px; }
.lane-verdict { font-size: 13.5px; color: var(--ink-soft); line-height: 1.8; margin-top: 16px; }
.lane-title { display: flex; align-items: center; gap: 10px; margin-bottom: 4px; }
.lane-title h3 { font-size: 19px; }

/* ============================ Signals ============================ */
.signal-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 16px; }
.signal-card {
  background: var(--card);
  border: 2px solid var(--navy);
  box-shadow: 6px 6px 0 rgba(20, 38, 59, .16);
  padding: 18px 20px;
}
.signal-card .top { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
.lamp { width: 14px; height: 14px; border: 2px solid var(--navy); border-radius: 50%; flex: 0 0 auto; }
.signal-card .name { font-weight: 700; font-size: 15.5px; line-height: 1.4; }
.fam {
  font-family: var(--font-num);
  font-size: 10.5px;
  letter-spacing: .08em;
  color: var(--paper);
  padding: 1px 8px;
  margin-left: auto;
  flex: 0 0 auto;
}
.signal-card dl { font-size: 12.5px; line-height: 1.7; }
.signal-card dt { font-family: var(--font-num); font-size: 10.5px; letter-spacing: .1em; color: var(--taupe); text-transform: uppercase; margin-top: 8px; }
.signal-card dd { color: var(--ink-soft); }
.signal-card dd.val { color: var(--navy); font-weight: 600; }
.signal-card dd.fals { color: var(--c-red); }
.signal-card .meta { font-family: var(--font-num); font-size: 10.5px; color: var(--taupe); margin-top: 10px; border-top: 1px solid var(--rule); padding-top: 8px; }

/* ============================ Gap table / footer ============================ */
.gap-table { width: 100%; border-collapse: collapse; font-size: 13px; }
.gap-table th, .gap-table td {
  border: 1px solid var(--rule);
  padding: 10px 12px;
  text-align: left;
  vertical-align: top;
  line-height: 1.65;
}
.gap-table th { background: var(--paper-deep); color: var(--navy); font-family: var(--font-head); font-size: 13.5px; }
.gap-table td { background: var(--card); color: var(--ink-soft); }
.limits { margin-top: 30px; font-size: 13.5px; color: var(--ink-soft); padding-left: 22px; }
.limits li { margin-bottom: 8px; }
.foot-meta {
  margin-top: 40px;
  border-top: 2px solid var(--navy);
  padding-top: 20px;
  font-size: 12.5px;
  color: var(--taupe);
  line-height: 2;
}
.foot-meta .disc { color: var(--c-red); font-weight: 600; }

/* Chart text defaults */
svg text { font-family: var(--font-body); fill: var(--navy); }
svg .axis text { font-family: var(--font-num); font-size: 10.5px; fill: var(--taupe); }
svg .axis line, svg .axis path { stroke: var(--rule); }
svg .anno { paint-order: stroke; stroke: var(--paper); stroke-width: 4px; stroke-linejoin: round; }

.hatch-def rect { fill: none; }

/* ============================ Responsive ============================ */
@media (max-width: 900px) {
  h2 { font-size: 30px; }
  .section { padding: 70px 24px; }
  .scrolly { flex-direction: column; }
  .scrolly .sticky-fig { height: 86vh; width: 100%; justify-content: center; }
  .scrolly .steps { margin: 0 auto; max-width: 360px !important; }
  .step { margin-bottom: 65vh; }
  .tile-grid { grid-template-columns: repeat(3, 1fr); }
  .score-row { grid-template-columns: 110px 1fr 110px; }
  #cover .stats { gap: 26px; }
}

  <script>/* pixel.js — 8-bit pixel ships built from exact character matrices.
   "." and spaces are transparent; every other character becomes one
   SVG <rect> with side length px. No emoji, no PNG, no generated art. */
(function () {
  "use strict";

  var MAPS = {
    container: [
      "..F.......................",
      "..B.......................",
      "..BB..12341234123412341...",
      "..BWB.43214321432143214...",
      "..BBB.21432143214321432...",
      "HHHHHHHHHHHHHHHHHHHHHHHH..",
      ".hHHHHHHHHHHHHHHHHHHHHh...",
      "..hhhhhhhhhhhhhhhhhhhh...."
    ],
    dry: [
      "..F.......................",
      "..BB......................",
      "..BWB..GG...GG...GG...G...",
      "..BBB.DDDD.DDDD.DDDD.DD...",
      "HHHHHHHHHHHHHHHHHHHHHHHH..",
      ".hHHHHHHHHHHHHHHHHHHHHh...",
      "..hhhhhhhhhhhhhhhhhhhh...."
    ],
    tanker: [
      "..F................O......",
      "..BB...PPPPPPPPPPPPPPP....",
      "..BWB..P....P....P....P...",
      "..BBBTTTTTTTTTTTTTTTTTT...",
      "TTTTTTTTTTTTTTTTTTTTTTTT..",
      ".tTTTTTTTTTTTTTTTTTTTTt...",
      "..tttttttttttttttttttt...."
    ]
  };

  var PALETTE = {
    H: "#14263B", h: "#0C1828", B: "#FDFAF2", b: "#D8CFBA", W: "#14263B",
    K: "#C0392B", "1": "#0E67B5", "2": "#5A9BD5", "3": "#C25E28", "4": "#1F8A70",
    D: "#C25E28", d: "#9A4A1F", G: "#8C8577", T: "#1F8A70", t: "#166955",
    P: "#C9BFA6", O: "#C0392B", F: "#E8B84B"
  };

  var SVGNS = "http://www.w3.org/2000/svg";

  // Build one ship as an SVG <g class="px-ship"> carrying data-w / data-h.
  function shipGroup(type, px) {
    var map = MAPS[type];
    if (!map) throw new Error("unknown ship type: " + type);
    px = px || 6;
    var g = document.createElementNS(SVGNS, "g");
    g.setAttribute("class", "px-ship");
    var cols = 0;
    map.forEach(function (row) { cols = Math.max(cols, row.length); });
    g.setAttribute("data-w", cols * px);
    g.setAttribute("data-h", map.length * px);
    map.forEach(function (row, y) {
      for (var x = 0; x < row.length; x++) {
        var ch = row[x];
        if (ch === "." || ch === " ") continue;
        var r = document.createElementNS(SVGNS, "rect");
        r.setAttribute("x", x * px);
        r.setAttribute("y", y * px);
        r.setAttribute("width", px);
        r.setAttribute("height", px);
        r.setAttribute("fill", PALETTE[ch] || "#14263B");
        g.appendChild(r);
      }
    });
    return g;
  }

  // Standalone <svg> wrapper for inline use (badges, dials, lanes).
  function shipSVG(type, px, scale) {
    var g = shipGroup(type, px);
    var w = +g.getAttribute("data-w");
    var h = +g.getAttribute("data-h");
    var svg = document.createElementNS(SVGNS, "svg");
    var s = scale || 1;
    svg.setAttribute("width", w * s);
    svg.setAttribute("height", h * s);
    svg.setAttribute("viewBox", "0 0 " + w + " " + h);
    svg.setAttribute("aria-hidden", "true");
    svg.appendChild(g);
    return svg;
  }

  // Build the cover sea: two pixelated wave bands (pure CSS drift) plus
  // three bobbing pixel ships slowly sailing across.
  function buildSea(host) {
    var band1 = document.createElement("div");
    band1.className = "wave-band b1";
    host.appendChild(band1);
    var band2 = document.createElement("div");
    band2.className = "wave-band b2";
    host.appendChild(band2);

    // Ships: outer .sail drives the -16vw -> 116vw voyage; inner .bob bobs.
    var fleet = [
      { type: "container", px: 6, scale: 1, dur: "52s", delay: "-8s", bottom: 0.30, bobDelay: "0s" },
      { type: "dry", px: 6, scale: 0.82, dur: "74s", delay: "-38s", bottom: 0.44, bobDelay: "-1.1s" },
      { type: "tanker", px: 6, scale: 0.7, dur: "96s", delay: "-64s", bottom: 0.58, bobDelay: "-2.2s" }
    ];
    fleet.forEach(function (f) {
      var div = document.createElement("div");
      div.className = "sail";
      div.style.animationDuration = f.dur;
      div.style.animationDelay = f.delay;
      div.style.bottom = (f.bottom * 100 * 0.24) + "vh";
      var bob = document.createElement("div");
      bob.className = "bob";
      bob.style.animationDelay = f.bobDelay;
      bob.appendChild(shipSVG(f.type, f.px, f.scale));
      div.appendChild(bob);
      host.appendChild(div);
    });
  }

  window.Pixel = {
    MAPS: MAPS,
    PALETTE: PALETTE,
    shipGroup: shipGroup,
    shipSVG: shipSVG,
    buildSea: buildSea
  };
})();
</script>
  <script>/* charts.js — all D3 renderers for the shipping-cycle story.
   Exposes window.UI (tooltip / drilldown / source lines) and window.Charts. */
(function () {
  "use strict";

  var D = window.DATA;
  var COL = {
    container: "#0E67B5",
    dry: "#C25E28",
    tanker: "#1F8A70",
    red: "#C0392B",
    navy: "#14263B",
    taupe: "#8C8577",
    rule: "#D8CFBA",
    paper: "#F7F2E7",
    card: "#FDFAF2",
    segIdle: "#E4DBC4"
  };
  var SECTOR_LABEL = { container: "Container shipping", dry: "Dry bulk", tanker: "Tanker shipping" };
  var parseDate = d3.timeParse("%Y-%m-%d");
  var fmtMonth = d3.timeFormat("%Y-%m");

  /* ================= Shared UI ================= */

  function ensureTooltip() {
    var t = document.getElementById("tooltip");
    if (!t) {
      t = document.createElement("div");
      t.id = "tooltip";
      t.setAttribute("role", "status");
      document.body.appendChild(t);
    }
    return t;
  }

  function showTooltip(html, x, y) {
    var t = ensureTooltip();
    t.innerHTML = html;
    t.style.opacity = 1;
    var cx = Math.min(x + 14, window.innerWidth - 320);
    var cy = Math.min(y + 14, window.innerHeight - 140);
    t.style.left = Math.max(4, cx) + "px";
    t.style.top = Math.max(4, cy) + "px";
  }

  function hideTooltip() {
    var t = document.getElementById("tooltip");
    if (t) t.style.opacity = 0;
  }

  function ensureOverlay() {
    var ov = document.getElementById("overlay");
    if (!ov) {
      ov = document.createElement("div");
      ov.id = "overlay";
      ov.innerHTML = '<div class="sheet" role="dialog" aria-modal="true">' +
        '<button class="close" aria-label="Close">X</button><div class="body"></div></div>';
      document.body.appendChild(ov);
      ov.addEventListener("click", function (e) { if (e.target === ov) closeDrill(); });
      ov.querySelector(".close").addEventListener("click", closeDrill);
      document.addEventListener("keydown", function (e) { if (e.key === "Escape") closeDrill(); });
    }
    return ov;
  }

  function openDrill(opts) {
    var ov = ensureOverlay();
    var body = ov.querySelector(".body");
    var html = "<h3>" + opts.title + "</h3>";
    if (opts.tag) {
      html += '<span class="tag" style="background:' + (opts.tagColor || COL.navy) + '">' + opts.tag + "</span>";
    }
    if (opts.nums && opts.nums.length) {
      html += '<div class="dd-nums">';
      opts.nums.forEach(function (n) {
        html += '<div class="nv"><div class="v" style="color:' + (n.color || COL.navy) + '">' + n.v +
          '</div><div class="l">' + n.l + "</div></div>";
      });
      html += "</div>";
    }
    (opts.body || []).forEach(function (p) { html += "<p>" + p + "</p>"; });
    if (opts.sources && opts.sources.length) {
      html += '<div class="dd-src"><strong>Sources</strong><br>' + opts.sources.map(function (s) {
        return s.url ? '&bull; <a href="' + s.url + '" target="_blank" rel="noopener">' + s.label + "</a>"
          : "&bull; " + s.label;
      }).join("<br>") + "</div>";
    }
    if (opts.asof) html += '<div class="dd-src">Data as of ' + opts.asof + "</div>";
    body.innerHTML = html;
    ov.classList.add("open");
  }

  function closeDrill() {
    var ov = document.getElementById("overlay");
    if (ov) ov.classList.remove("open");
  }

  // Source line: first source inline; the rest behind a native <details>.
  function srcLine(host, sources, asof, extra) {
    if (!sources) sources = [];
    var div = document.createElement("div");
    div.className = "srcline";
    var html = "Source: ";
    if (sources.length) {
      var s0 = sources[0];
      html += s0.url ? '<a href="' + s0.url + '" target="_blank" rel="noopener">' + s0.label + "</a>" : s0.label;
    } else {
      html += "uploaded analysis workbook";
    }
    if (sources.length > 1) {
      html += ' <details><summary>+' + (sources.length - 1) + " more sources</summary><ul>";
      sources.slice(1).forEach(function (s) {
        html += "<li>" + (s.url ? '<a href="' + s.url + '" target="_blank" rel="noopener">' + s.label + "</a>" : s.label) + "</li>";
      });
      html += "</ul></details>";
    }
    if (asof) html += ' &middot; <span class="asof">as of ' + asof + "</span>";
    if (extra) html += " &middot; " + extra;
    div.innerHTML = html;
    host.appendChild(div);
    return div;
  }

  function bindHover(selection, htmlFn) {
    selection
      .on("mousemove", function (event, d) { showTooltip(htmlFn(d), event.clientX, event.clientY); })
      .on("mouseleave", hideTooltip);
  }

  window.UI = {
    COL: COL,
    SECTOR_LABEL: SECTOR_LABEL,
    showTooltip: showTooltip,
    hideTooltip: hideTooltip,
    openDrill: openDrill,
    closeDrill: closeDrill,
    srcLine: srcLine,
    bindHover: bindHover,
    parseDate: parseDate
  };

  /* ================= 1. Three clocks ================= */

  var STAGES = [
    { id: "top", label: "Top" },
    { id: "early_downturn", label: "Early downturn" },
    { id: "profit_pressure", label: "Profit pressure" },
    { id: "clearing", label: "Clearing" },
    { id: "bottom_observation", label: "Bottom observation" },
    { id: "early_recovery", label: "Early recovery" },
    { id: "re_expansion", label: "Re-expansion" }
  ];

  function clockDial(host, cfg) {
    var R = 118;
    var size = R * 2 + 76;
    var svg = d3.select(host).append("svg")
      .attr("width", size).attr("height", size)
      .attr("viewBox", "0 0 " + size + " " + size)
      .attr("role", "img")
      .attr("aria-label", cfg.sectorLabel + " cycle dial, current stage: " + STAGES[cfg.current].label);
    var g = svg.append("g").attr("transform", "translate(" + size / 2 + "," + size / 2 + ")");

    var arc = d3.arc()
      .innerRadius(R - 34)
      .outerRadius(R)
      .startAngle(function (d) { return d.a0; })
      .endAngle(function (d) { return d.a1; })
      .padAngle(0.012)
      .cornerRadius(0);

    var span = 0.82 * Math.PI;
    var arcs = STAGES.map(function (s, i) {
      var a0 = -span + (2 * span) * (i / STAGES.length);
      var a1 = -span + (2 * span) * ((i + 1) / STAGES.length);
      return { i: i, stage: s, a0: a0, a1: a1 };
    });

    g.selectAll("path.dial-stage")
      .data(arcs)
      .join("path")
      .attr("class", "dial-stage")
      .attr("d", arc)
      .attr("fill", function (d) { return d.i === cfg.current ? cfg.color : COL.segIdle; })
      .attr("stroke", COL.navy)
      .attr("stroke-width", 1)
      .on("mousemove", function (event, d) {
        showTooltip(
          '<div class="tt-title">Stage ' + (d.i + 1) + " of 7: " + d.stage.label + "</div>" +
          "<div>" + (d.i === cfg.current ? "Current position of " + cfg.sectorLabel + "." : "Not the current stage.") + "</div>" +
          '<div class="tt-src">' + cfg.source + "</div>",
          event.clientX, event.clientY);
      })
      .on("mouseleave", hideTooltip);

    // Outside labels
    g.selectAll("text.dial-label")
      .data(arcs)
      .join("text")
      .attr("text-anchor", function (d) {
        var mid = (d.a0 + d.a1) / 2;
        return mid < -0.15 ? "end" : mid > 0.15 ? "start" : "middle";
      })
      .attr("transform", function (d) {
        var mid = (d.a0 + d.a1) / 2;
        var r = R + 16;
        var x = Math.sin(mid) * r;
        var y = -Math.cos(mid) * r;
        return "translate(" + x + "," + y + ")";
      })
      .attr("font-size", 9.5)
      .attr("fill", function (d) { return d.i === cfg.current ? cfg.color : COL.taupe; })
      .attr("font-weight", function (d) { return d.i === cfg.current ? 700 : 400; })
      .each(function (d) {
        var words = d.stage.label.split(" ");
        var t = d3.select(this);
        if (words.length === 1) { t.text(words[0]); return; }
        var mid = (d.a0 + d.a1) / 2;
        var anchor = mid < -0.15 ? "end" : mid > 0.15 ? "start" : "middle";
        t.text("");
        t.append("tspan").attr("x", 0).attr("dy", "-0.4em").text(words[0]);
        t.append("tspan").attr("x", 0).attr("dy", "1.1em")
          .attr("text-anchor", anchor).text(words.slice(1).join(" "));
      });

    // Pointer: 3px round-capped, aimed at current segment midpoint
    var midCur = (arcs[cfg.current].a0 + arcs[cfg.current].a1) / 2;
    var px = Math.sin(midCur) * (R - 17);
    var py = -Math.cos(midCur) * (R - 17);
    g.append("line")
      .attr("x1", 0).attr("y1", 0)
      .attr("x2", px).attr("y2", py)
      .attr("stroke", COL.navy)
      .attr("stroke-width", 3)
      .attr("stroke-linecap", "round");
    g.append("circle").attr("r", 6).attr("fill", COL.navy);

    // Pixel ship in the hub area
    var ship = window.Pixel.shipSVG(cfg.ship, 3, 1);
    var sw = +ship.getAttribute("width");
    var sh = +ship.getAttribute("height");
    ship.setAttribute("x", -sw / 2);
    ship.setAttribute("y", R * 0.28);
    g.node().appendChild(ship);
  }

  function clocks(host) {
    var wrap = document.createElement("div");
    wrap.className = "clocks";
    var ab = D.answer_box;
    var compare = D.table_subindustry_compare.rows;
    var rateRow = compare[0]; // current freight rates 07-10

    var configs = [
      {
        sector: "container", ship: "container", color: COL.container, current: 0,
        badge: ab.cohort_stage_split[0].stage,
        index: "SCFI 3,184.83",
        why: ab.current_stage_by_case[0].stage + " — " + ab.current_stage_by_case[0].why +
          ". Event-driven tightness overlays a 38–39% orderbook with deliveries peaking in 2029.",
        source: "Shanghai Shipping Exchange / Alphaliner, as of 2026-07-10"
      },
      {
        sector: "dry", ship: "dry", color: COL.dry, current: 5,
        badge: ab.cohort_stage_split[1].stage,
        index: "BDI 2,944",
        why: ab.current_stage_by_case[1].stage + " — " + ab.current_stage_by_case[1].why +
          ". A ~7% orderbook (multi-year low) meets rerouting-driven ton-miles.",
        source: "akshare daily / Clarksons via Benzinga, as of 2026-07-10"
      },
      {
        sector: "tanker", ship: "tanker", color: COL.tanker, current: 6,
        badge: ab.cohort_stage_split[2].stage,
        index: "BDTI 2,031",
        why: "Renewed expansion — earnings at a 19-month high and 2025 profits at a record; scrapping near zero while the fleet ages.",
        source: "akshare daily / Riviera-Clarksons, as of 2026-07-10"
      }
    ];

    configs.forEach(function (cfg) {
      var card = document.createElement("div");
      card.className = "clock-card";
      var dialHost = document.createElement("div");
      card.appendChild(dialHost);
      clockDial(dialHost, {
        sectorLabel: SECTOR_LABEL[cfg.sector],
        color: cfg.color,
        current: cfg.current,

      });
      var meta = document.createElement("div");
      meta.className = "clock-meta";
      meta.innerHTML =
        '<div class="sector-name" style="color:' + cfg.color + '">' + SECTOR_LABEL[cfg.sector] + "</div>" +
        '<div class="stage-line" style="color:' + cfg.color + '">' + cfg.badge + "</div>" +
        '<div class="idx" style="color:' + cfg.color + '">' + cfg.index + "</div>" +
        '<div class="why">' + cfg.why + "</div>" +
        '<div class="src">' + cfg.source + " &middot; same-date rate: " + rateRow[cfg.sector === "container" ? 1 : cfg.sector === "dry" ? 2 : 3] + "</div>";
      card.appendChild(meta);
      wrap.appendChild(card);
    });
    host.appendChild(wrap);
  }

  /* ================= 2. COSCO stock scrolly ================= */

  var STOCK_STATES = [
    { key: "overview", pins: null, op: 0.85, win: null },
    { key: "listing", pins: [0, 1], op: 1, win: ["2007-06-01", "2007-12-31"] },
    { key: "distress", pins: [2], op: 1, win: ["2011-01-01", "2013-12-31"] },
    { key: "restructuring", pins: [3], op: 1, win: ["2015-06-01", "2016-12-31"] },
    { key: "floor", pins: [4], op: 1, win: ["2020-01-01", "2020-08-31"] },
    { key: "tenfold", pins: [5], op: 1, win: ["2020-05-01", "2021-12-31"] },
    { key: "windfalls", pins: [6, 7], op: 1, win: ["2023-12-01", "2026-07-10"] }

  function stockChart(host) {
    var rows = D.anchor_monthly.rows.map(function (r) { return { date: parseDate(r[0]), value: r[1] }; });
    var events = D.cosco_events.map(function (e, i) {
      return { i: i, date: parseDate(e.date), label: e.label, detail: e.detail, src: e.src };
    });

    var totalW = Math.min(host.getBoundingClientRect().width || 820, 820);
    var W = Math.max(totalW, 320), H = 560;
    var m = { t: 40, r: 16, b: 36, l: 48 };
    var iw = W - m.l - m.r, ih = H - m.t - m.b;

    var svg = d3.select(host).append("svg")
      .attr("width", W).attr("height", H)
      .attr("viewBox", "0 0 " + W + " " + H)
      .attr("role", "img")
      .attr("aria-label", "COSCO Shipping Holdings forward-adjusted monthly share price, 2007 to 2026");
    var g = svg.append("g").attr("transform", "translate(" + m.l + "," + m.t + ")");

    var x = d3.scaleTime().domain(d3.extent(rows, function (d) { return d.date; })).range([0, iw]);
    var y = d3.scaleLinear().domain([0, d3.max(rows, function (d) { return d.value; }) * 1.08]).range([ih, 0]);

    // window rectangle (pale red, dashed)
    var winRect = g.append("rect")
      .attr("y", 0).attr("height", ih)
      .attr("fill", "rgba(192,57,43,.07)")
      .attr("stroke", COL.red)
      .attr("stroke-dasharray", "5,4")
      .attr("stroke-width", 1.2)
      .style("opacity", 0);

    var area = d3.area()
      .x(function (d) { return x(d.date); })
      .y0(ih)
      .y1(function (d) { return y(d.value); });
    var line = d3.line()
      .x(function (d) { return x(d.date); })
      .y(function (d) { return y(d.value); });

    g.append("path").datum(rows)
      .attr("d", area)
      .attr("fill", "rgba(14,103,181,.16)");
    g.append("path").datum(rows)
      .attr("d", line)
      .attr("fill", "none")
      .attr("stroke", COL.container)
      .attr("stroke-width", 2.2);

    g.append("g").attr("class", "axis")
      .attr("transform", "translate(0," + ih + ")")
      .call(d3.axisBottom(x).ticks(d3.timeYear.every(2)).tickFormat(d3.timeFormat("%Y")));
    g.append("g").attr("class", "axis")
      .call(d3.axisLeft(y).ticks(6));

    // invisible hover band for the raw series
    g.selectAll("circle.pt")
      .data(rows)
      .join("circle")
      .attr("class", "pt")
      .attr("cx", function (d) { return x(d.date); })
      .attr("cy", function (d) { return y(d.value); })
      .attr("r", 5)
      .attr("fill", "transparent")
      .on("mousemove", function (event, d) {
        showTooltip('<div class="tt-title">' + fmtMonth(d.date) + '</div><div>CNY ' + d.value.toFixed(2) +
          ' (forward-adjusted)</div><div class="tt-src">' + D.anchor_monthly.basis + "</div>",
          event.clientX, event.clientY);
      })
      .on("mouseleave", hideTooltip);

    // event pins: 26px stem, 5px red dot, label
    var pin = g.selectAll("g.pin")
      .data(events)
      .join("g")
      .attr("class", "pin")
      .attr("transform", function (d) { return "translate(" + x(d.date) + "," + y(valueAt(d.date)) + ")"; })
      .style("cursor", "pointer");

    function valueAt(date) {
      var key = fmtMonth(date);
      var hit = rows.filter(function (r) { return fmtMonth(r.date) === key; });
      return hit.length ? hit[0].value : rows[rows.length - 1].value;
    }

    pin.append("line")
      .attr("y1", -26).attr("y2", 0)

    pin.append("circle")

/* charts.js — part 3: 2.5D orderbook, lead-lag, scorecard, bridge, lanes, signals, gaps */
(function () {

  /* ================= 6. 2.5D orderbook ================= */

  function orderbook(host) {

    var svg = d3.select(host).append("svg")

      lx += 20 + li.select("text").node().getComputedTextLength() + 28;
    });

    var layerH = 17, frontW = 26, depth = 12, depthY = 7;
    var bandW = iw / cats.length;
    var pileOffsets = [-44, 0, 44];

    function isoBox(pg, x, yBase, w, h, color) {
      // front
      pg.append("rect")
        .attr("x", x).attr("y", yBase - h)
        .attr("width", w).attr("height", h)
        .attr("fill", color).attr("stroke", COL.navy).attr("stroke-width", 0.7);
      // top (light)
      pg.append("polygon")
        .attr("points", [
          [x, yBase - h], [x + depth, yBase - h - depthY],
          [x + w + depth, yBase - h - depthY], [x + w, yBase - h]
        ].map(function (p) { return p.join(","); }).join(" "))
        .attr("fill", shade(color, 1.45)).attr("stroke", COL.navy).attr("stroke-width", 0.7);
      // right (dark)
      pg.append("polygon")
        .attr("points", [
          [x + w, yBase - h], [x + w + depth, yBase - h - depthY],
          [x + w + depth, yBase - depthY], [x + w, yBase]
        ].map(function (p) { return p.join(","); }).join(" "))
        .attr("fill", shade(color, 0.62)).attr("stroke", COL.navy).attr("stroke-width", 0.7);
    }

    var baseY = ih;
    var labelLayer = g.append("g");
    var catSources = ["hapag_prospectus", "vliz_notteboom", "unctad_rmt2012", "costamare_20f",
      "costamare_20f", "offshore_energy_clarksons", "riviera_tanker", "alphaliner_safety4sea"];

    cats.forEach(function (cat, ci) {
      var cx = ci * bandW + bandW / 2;
      series.forEach(function (s, si) {
        var v = s.data[ci];
        if (v == null) return;
        var full = Math.floor(v / 5);
        var frac = v / 5 - full;
        var px = cx + pileOffsets[si] - frontW / 2;
        var pg = g.append("g").style("cursor", "pointer");
        for (var l = 0; l < full; l++) {
          isoBox(pg, px, baseY - l * layerH, frontW, layerH, colors[si]);
        }
        if (frac > 0.0001) {
          isoBox(pg, px, baseY - full * layerH, frontW, layerH * frac, colors[si]);
        }
        var totalHpx = (v / 5) * layerH;
        pg.on("mousemove", function (event) {
          showTooltip('<div class="tt-title">' + s.name + " — " + cat + '</div><div>Orderbook: ' + v + '% of fleet</div>' +
            '<div class="tt-src">' + catSources[ci] + " — one layer = 5 percentage points</div>", event.clientX, event.clientY);
        }).on("mouseleave", hideTooltip)
          .on("click", function () {
            openDrill({
              title: s.name + " orderbook, " + cat,
              tag: "Orderbook / fleet",
              tagColor: colors[si],
              nums: [{ v: v + "%", l: "orderbook as share of active fleet", color: colors[si] }],
              body: [
                "Metric definition: " + spec.metric_definition,
                "Point-specific citation: " + catSources[ci] + " (each point follows its own reporting methodology; TEU for container, dwt for dry bulk and tanker)."
              ],
              sources: spec.source,
              asof: spec.asof
            });
          });
        // numeric labels drawn last so no pile covers them
        labelLayer.append("text")
          .attr("x", px + frontW / 2 + depth / 2)
          .attr("y", baseY - totalHpx - depthY - 6)
          .attr("text-anchor", "middle")
          .attr("font-size", 12.5)
          .attr("font-weight", 700)
          .attr("font-family", "SF Mono, Menlo, monospace")
          .attr("fill", colors[si])
          .attr("class", "anno")
          .text(v);
      });
      g.append("text")
        .attr("x", cx).attr("y", baseY + 24)
        .attr("text-anchor", "middle")
        .attr("font-size", 11.5)
        .attr("font-family", "SF Mono, Menlo, monospace")
        .attr("fill", COL.taupe)
        .text(cat);
    });

    // baseline
    g.append("line").attr("x1", 0).attr("x2", iw).attr("y1", baseY).attr("y2", baseY)
      .attr("stroke", COL.navy).attr("stroke-width", 1.5);

    // annotations
    g.append("text")
      .attr("x", bandW * 1).attr("y", 30)
      .attr("text-anchor", "middle")
      .attr("font-size", 13).attr("font-weight", 700)
      .attr("fill", COL.red).attr("class", "anno")
      .text("The leverage setup on the eve of the crisis ▼");
    g.append("text")
      .attr("x", iw).attr("y", 30)
      .attr("text-anchor", "end")
      .attr("font-size", 13).attr("font-weight", 700)
      .attr("fill", COL.container).attr("class", "anno")
      .text("Only container shipping borrowed the leverage back ▶");
  }

  /* ================= 7. Freight-rate lead / lag ================= */

  function leadlagPanel(host, cfg) {

    var chartHost = document.createElement("div");

    var quarters = cfg.quarters;
    var n = quarters.length;
    var W = Math.max(chartHost.getBoundingClientRect().width || 700, 320);
    var H = 300;
    var m = { t: 16, r: 56, b: 46, l: 48 };
    var iw = W - m.l - m.r, ih = H - m.t - m.b;
    var svg = d3.select(chartHost).append("svg")
      .attr("width", W).attr("height", H)
      .attr("viewBox", "0 0 " + W + " " + H)
      .attr("role", "img")
      .attr("aria-label", cfg.title);
    var g = svg.append("g").attr("transform", "translate(" + m.l + "," + m.t + ")");

    var x = d3.scaleBand().domain(quarters).range([0, iw]).padding(0.25);
    var mExt = d3.extent(cfg.margin);
    var mBound = Math.max(Math.abs(mExt[0]), Math.abs(mExt[1])) * 1.15;
    var yL = d3.scaleLinear().domain([-mBound, mBound]).range([ih, 0]);
    var rateVals = cfg.rate.filter(function (v) { return v != null; });
    var yR = d3.scaleLinear().domain([0, d3.max(rateVals) * 1.1]).range([ih, 0]);

    g.append("g").attr("class", "axis")
      .call(d3.axisLeft(yL).ticks(5).tickFormat(function (d) { return d + "%"; }));
    g.append("g").attr("class", "axis")
      .attr("transform", "translate(" + iw + ",0)")
      .call(d3.axisRight(yR).ticks(5));
    g.append("g").attr("class", "axis")
      .attr("transform", "translate(0," + ih + ")")
      .call(d3.axisBottom(x).tickValues(quarters.filter(function (q, i) { return i % 4 === 0; })));
    g.append("line").attr("x1", 0).attr("x2", iw).attr("y1", yL(0)).attr("y2", yL(0))
      .attr("stroke", COL.navy).attr("stroke-width", 1.2);

    g.selectAll("rect.mbar")
      .data(cfg.margin.map(function (v, i) { return { v: v, q: quarters[i] }; }))
      .join("rect")
      .attr("x", function (d) { return x(d.q); })
      .attr("width", x.bandwidth())
      .attr("y", function (d) { return d.v >= 0 ? yL(d.v) : yL(0); })
      .attr("height", function (d) { return Math.abs(yL(d.v) - yL(0)); })
      .attr("fill", function (d) { return d.v >= 0 ? COL.taupe : COL.red; })
      .attr("opacity", 0.85)
      .on("mousemove", function (event, d) {
        showTooltip('<div class="tt-title">' + d.q + '</div><div>' + cfg.marginName + ": " + d.v + "%</div>", event.clientX, event.clientY);
      })
      .on("mouseleave", hideTooltip);

    var lineG = g.append("g");
    function ratePoints(shift) {
      var pts = [];
      cfg.rate.forEach(function (v, i) {
        if (v == null) return;
        var j = i + shift;
        if (j >= n) return;
        pts.push({ q: quarters[j], v: v, orig: quarters[i] });
      });
      return pts;
    }
    var lineGen = d3.line()
      .x(function (d) { return x(d.q) + x.bandwidth() / 2; })
      .y(function (d) { return yR(d.v); });

    function drawRate(shift, animate) {
      var pts = ratePoints(shift);
      var path = lineG.selectAll("path.rline").data([pts]);
      var entered = path.enter().append("path")
        .attr("class", "rline")
        .attr("fill", "none")
        .attr("stroke", cfg.color)
        .attr("stroke-width", 2)
        .merge(path);
      var drawIt = function (sel) { sel.attr("d", lineGen); };
      if (animate) entered.transition().duration(760).ease(d3.easeCubicInOut).call(function (t) { t.attr("d", lineGen); });
      else drawIt(entered);
      var dots = lineG.selectAll("circle.rdot").data(pts, function (d) { return d.orig; });
      dots.exit().remove();
      var dEnter = dots.enter().append("circle")
        .attr("class", "rdot")
        .attr("r", 3.6)
        .attr("fill", cfg.color)
        .attr("stroke", COL.card).attr("stroke-width", 1.2)
        .merge(dots);
      var placeDots = function (sel) {
        sel.attr("cx", function (d) { return x(d.q) + x.bandwidth() / 2; })
          .attr("cy", function (d) { return yR(d.v); });
      };
      if (animate) dEnter.transition().duration(760).ease(d3.easeCubicInOut)
        .attr("cx", function (d) { return x(d.q) + x.bandwidth() / 2; })
        .attr("cy", function (d) { return yR(d.v); });
      else placeDots(dEnter);
      lineG.selectAll("circle.rdot")
        .on("mousemove", function (event, d) {
          showTooltip('<div class="tt-title">' + cfg.rateName + " " + d.v.toLocaleString() + '</div><div>Observed ' + d.orig + ", plotted at " + d.q + "</div>", event.clientX, event.clientY);
        })
        .on("mouseleave", hideTooltip);
    }
    drawRate(0, false);

    var playing = false;
    btn.addEventListener("click", function () {
      if (playing) return;
      playing = true;
      btn.disabled = true;
      var k = 0;
      status.textContent = "Shifted right by 0 quarters";
      drawRate(0, false);
      function step() {
        k += 1;
        drawRate(k, true);
        status.textContent = "Shifted right by " + k + " quarter" + (k > 1 ? "s" : "");
        if (k < cfg.maxShift) {
          setTimeout(step, 760 + 560);
        } else {
          setTimeout(function () {
            status.textContent = "Shifted right by " + k + " quarters — the shapes align.";
            btn.textContent = "Replay";
            btn.disabled = false;
            playing = false;
          }, 900);
        }
      }
      setTimeout(step, 400);
    });
  }

  <script>/* scrolly.js — Scrollama wiring for the three scrollytelling blocks. */
(function () {
  "use strict";

  function setup(containerSel, onStep) {
    var container = document.querySelector(containerSel);
    if (!container || typeof scrollama === "undefined") return { resize: function () {} };
    var scroller = scrollama();
    scroller
      .setup({ step: containerSel + " .step", offset: 0.62 })
      .onStepEnter(function (response) {
        var steps = container.querySelectorAll(".step");
        steps.forEach(function (s) { s.classList.remove("active"); });
        response.element.classList.add("active");
        var idx = Array.prototype.indexOf.call(steps, response.element);
        onStep(idx);
      });
    return scroller;
  }

  function init(handlers) {
    var scrollers = [
      setup("#scrolly-stock", handlers.stock),
      setup("#scrolly-curves", handlers.curves),
      setup("#scrolly-tiles", handlers.tiles)
    ];
    window.addEventListener("resize", function () {
      scrollers.forEach(function (s) { s.resize(); });
    });
    // Activate the first step of each scrolly on load.
    ["#scrolly-stock", "#scrolly-curves", "#scrolly-tiles"].forEach(function (sel, i) {
      var first = document.querySelector(sel + " .step");
      if (first) first.classList.add("active");
    });
  }

  window.Scrolly = { init: init };
})();
</script>

      {

        def: "Orderbook dwt ÷ active fleet dwt; multi-year low. Source: Alphaliner / Clarksons disclosures, 2026-06."
      },
      {
        v: 14.7, color: UI.COL.tanker, label: "Tanker orderbook, % of fleet (2025-09)",
        def: "Orderbook dwt ÷ active fleet dwt; up from 7%. Source: Riviera / Clarksons, 2025-11-10."
      }
    ];
    var statsWrap = el("div", "stats");
    var maxV = 38.7;
    stats.forEach(function (s) {
      var st = el("div", "stat");
      st.setAttribute("role", "button");
      st.setAttribute("aria-label", s.label + " — jump to orderbook chart");
      var v = el("div", "v", "0.0%");
      v.style.color = s.color;
      v.dataset.target = s.v;
      var bar = el("div", "bar");
      bar.style.background = s.color;
      bar.style.width = "0px";
      bar.dataset.targetW = Math.round((s.v / maxV) * 150);
      var l = el("div", "l", s.label);
      st.appendChild(v);
      st.appendChild(bar);
      st.appendChild(l);
      st.addEventListener("mousemove", function (e) {
        UI.showTooltip('<div class="tt-title">' + s.label + '</div><div>' + s.def + "</div>", e.clientX, e.clientY);
      });
      st.addEventListener("mouseleave", UI.hideTooltip);
      st.addEventListener("click", function () {
        document.getElementById("orderbook").scrollIntoView({ behavior: "smooth" });
      });
      statsWrap.appendChild(st);
    });
    inner.appendChild(statsWrap);
    cover.appendChild(inner);

    var sea = el("div");
    sea.id = "sea";
    cover.appendChild(sea);

    var hint = el("div");
    hint.id = "scroll-hint";
    hint.innerHTML = 'SCROLL<span class="arrow">▼</span>';
    cover.appendChild(hint);

    body.appendChild(cover);

    // count from zero over 1400ms, d3 cubic-out, once visible
    var counted = false;
    function countUp() {
      if (counted) return;
      counted = true;
      d3.selectAll("#cover .stat .v").each(function () {
        var node = this;
        var target = +node.dataset.target;
        d3.select(node)
          .transition()
          .duration(1400)
          .ease(d3.easeCubicOut)
          .tween("text", function () {
            var i = d3.interpolateNumber(0, target);
            return function (t) { node.textContent = i(t).toFixed(1) + "%"; };
          });
      });
      d3.selectAll("#cover .stat .bar").each(function () {
        var w = +this.dataset.targetW;
        d3.select(this)
          .transition()
          .duration(1400)
          .ease(d3.easeCubicOut)
          .style("width", w + "px");
      });
    }
    if ("IntersectionObserver" in window) {
      var io = new IntersectionObserver(function (entries) {
        entries.forEach(function (en) { if (en.isIntersecting) { countUp(); io.disconnect(); } });
      }, { threshold: 0.4 });
      io.observe(statsWrap);
    } else {
      countUp();
    }

    window.Pixel.buildSea(sea);
  }

  /* ---------------- Boot ---------------- */
  function boot() {
    var body = document.body;
    buildCover(body);

    var main = el("main");
    body.appendChild(main);
    window.Sections.build(main);

    // Charts
    C.clocks(document.getElementById("clocks-viz"));
    var stock = C.stockChart(document.getElementById("stock-chart"));
    var curves = C.curvesChart(document.getElementById("curves-chart"));
    var tiles = C.tileWall(document.getElementById("tiles-wall"));
    C.quarterly(document.getElementById("quarterly-viz"));
    C.orderbook(document.getElementById("orderbook-viz"));
    C.leadlag(document.getElementById("leadlag-viz"));
    C.scorecard(document.getElementById("scorecard-viz"));
    C.bridge(document.getElementById("bridge-viz"));
    C.lanes(document.getElementById("lanes-viz"));
    C.signals(document.getElementById("signals-viz"));
    C.gaps(document.getElementById("gaps-viz"));

    // Source lines
    UI.srcLine(document.getElementById("clocks"),
      [{ label: "Shanghai Shipping Exchange SCFI/CCFI website (2026-07-10)", url: "https://www.sse.net.cn/index/singleIndex?indexType=scfi" },
       { label: "SAFETY4SEA/Alphaliner, 2026-06-24: orderbook at 38.3%", url: "https://safety4sea.com/alphaliner-containership-ordering-moves-towards-smaller-tonnage/" }],
      D.meta.asof, "answer box v" + D.answer_box.version);
    UI.srcLine(document.getElementById("stock"),
      D.chart_specs.chart_stockline_cosco.source, D.chart_specs.chart_stockline_cosco.asof,
      D.anchor_monthly.basis);
    UI.srcLine(document.getElementById("curves"),
      D.chart_specs.chart_scfi_points.source.concat([{ label: "AkShare: Baltic indices daily (BDI 1988 on; tanker 2001 on)", url: "outputs/assets/akshare/bdi_daily.csv" }]),
      D.meta.asof, "disclosed points only; no interpolation");
    UI.srcLine(document.getElementById("cohort"),
      D.table_cohort_legend.source, D.table_cohort_legend.asof,
      "fates cross-checked with the extinction and consolidation ledger");
    UI.srcLine(document.getElementById("quarterly"),
      D.table_cosco_q_w2.source, D.table_cosco_q_w2.asof,
      "quarterly = cumulative-statement difference (derived)");
    UI.srcLine(document.getElementById("orderbook"),
      D.chart_specs.chart_orderbook_history.source, D.chart_specs.chart_orderbook_history.asof,
      "TEU for container; dwt for dry bulk and tanker");
    UI.srcLine(document.getElementById("leadlag"),
      D.chart_specs.chart_leadlag_container_rate.source.concat(D.chart_specs.chart_leadlag_tanker_margin.source),
      D.meta.asof, "read the two charts vertically; axes are independent");
    UI.srcLine(document.getElementById("scorecard"),
      D.table_analog_scorecard.source, D.table_analog_scorecard.asof,
      "shape similarity is not mechanism identity");
    UI.srcLine(document.getElementById("bridge"),
      D.table_subindustry_compare.source, D.table_subindustry_compare.asof,
      "prohibitions from the same-date comparison table");
    UI.srcLine(document.getElementById("current"),
      D.table_subindustry_compare.source, D.meta.asof,
      "stages tentative; metric cards carry their own citations");
    UI.srcLine(document.getElementById("signals"),
      [{ label: "Monitoring checklist: thresholds, sources, and falsifiers as registered in the analysis workbook" }],
      D.meta.asof, "eight signals across price, capacity, event, and financials");
    UI.srcLine(document.getElementById("gaps"),
      D.table_gap_register.source, D.table_gap_register.asof,
      "the complete gap register; nothing silently spliced");

    // Scrolly wiring
    window.Scrolly.init({
      stock: stock.setState,
      curves: curves.setState,
      tiles: tiles.setState
    });
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", boot);
  } else {
    boot();
  }
})();
</script>
